name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  vitaeo-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test
      - run: yarn build
